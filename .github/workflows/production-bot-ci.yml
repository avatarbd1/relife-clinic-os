name: Production Bot CI

on:
  push:
    branches: [main]
    paths:
      - '03_Bot/**'
      - '07_Testing/test_staff_ai_data_minimization.py'
      - '07_Testing/test_finance_cash_custody.py'
      - '07_Testing/test_department_access.py'
      - '07_Testing/test_department_patient_wiring.py'
      - '07_Testing/test_department_schema_audit.py'
      - '07_Testing/test_department_schema_migration.py'
      - '05_GoogleSheets/audit_department_schema.py'
      - '05_GoogleSheets/migrate_department_schema.py'
      - '.github/workflows/production-bot-ci.yml'
  pull_request:
    paths:
      - '03_Bot/**'
      - '07_Testing/test_staff_ai_data_minimization.py'
      - '07_Testing/test_finance_cash_custody.py'
      - '07_Testing/test_department_access.py'
      - '07_Testing/test_department_patient_wiring.py'
      - '07_Testing/test_department_schema_audit.py'
      - '07_Testing/test_department_schema_migration.py'
      - '05_GoogleSheets/audit_department_schema.py'
      - '05_GoogleSheets/migrate_department_schema.py'
      - '.github/workflows/production-bot-ci.yml'

permissions:
  contents: read

jobs:
  production-bot-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production bot dependencies
        run: python -m pip install -r 03_Bot/requirements.txt
      - name: Compile production bot modules
        run: python -m compileall -q 03_Bot
      - name: Verify external-AI data minimization
        run: |
          python -m unittest -v \
            07_Testing/test_staff_ai_data_minimization.py \
            07_Testing/test_user_facing_copy.py \
            07_Testing/test_attendance_integrity.py \
            07_Testing/test_attendance_location.py \
            07_Testing/test_multitenant_isolation.py \
            07_Testing/test_finance_cash_custody.py \
            07_Testing/test_department_access.py \
            07_Testing/test_department_patient_wiring.py \
            07_Testing/test_department_schema_audit.py \
            07_Testing/test_department_schema_migration.py \
            07_Testing/test_sentry_policy.py
