name: BrainOS Safety CI

on:
  push:
    branches:
      - main
      - 'brainos/**'
    paths:
      - 'development/15_AI_Brain/**'
      - '.github/workflows/brainos-ci.yml'
  pull_request:
    paths:
      - 'development/15_AI_Brain/**'
      - '.github/workflows/brainos-ci.yml'

permissions:
  contents: read

jobs:
  brainos-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BrainOS test dependency
        run: python -m pip install "requests>=2.32.0"

      - name: Compile BrainOS control modules
        run: |
          python -m py_compile \
            development/15_AI_Brain/Control/confirm_gate.py \
            development/15_AI_Brain/Control/scheduler.py \
            development/15_AI_Brain/Control/dispatcher_bridge.py \
            development/15_AI_Brain/Control/concurrency_lock.py \
            development/15_AI_Brain/Control/alert_notifier.py \
            development/15_AI_Brain/Control/worker_coordinator.py \
            development/15_AI_Brain/Control/provider_router.py \
            development/15_AI_Brain/Control/task_router_bridge.py \
            development/15_AI_Brain/Control/task_detector.py \
            development/15_AI_Brain/Core/task_executor.py \
            development/15_AI_Brain/Control/test_confirm_gate_policy.py \
            07_Testing/test_dispatcher_coordination.py \
            07_Testing/test_worker_coordinator.py \
            07_Testing/test_task_detector.py

      - name: Validate cron shell scripts
        run: bash -n brainos_cron_cycle.sh install_brainos_cron.sh configure_runtime_git_hygiene.sh

      - name: Verify runtime ignore policy
        run: |
          git check-ignore -q development/15_BrainOS/TaskInbox/example.txt
          git check-ignore -q development/15_AI_Brain/Proposals/Approved/TASK-TEST.proposal.json
          git check-ignore -q development/15_AI_Brain/Logs/scheduler.pid

      - name: Confirm Gate unit tests
        working-directory: development/15_AI_Brain/Control
        run: python -m unittest -v test_confirm_gate_policy.py

      - name: Pipeline wiring regression tests
        run: |
          python -m unittest -v \
            07_Testing/test_dispatcher_coordination.py \
            07_Testing/test_worker_coordinator.py \
            07_Testing/test_task_detector.py
